<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Stock Analysis Web Application</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Real-Time Stock Analysis Web Application</h1>

    <section class="panel">
      <h2>[1] Run Stock Analysis (DSA Algorithms)</h2>
      <button id="analyzeBtn">Run Stock Analysis</button>
      <div id="analysisResult" class="result"></div>
    </section>

    <section class="panel">
      <h2>[2] Search Stock Price by Date (Binary Search)</h2>
      <div class="row">
        <label for="dateInput">Enter Date</label>
        <input id="dateInput" type="date">
        <button id="searchBtn">Search</button>
      </div>
      <div id="searchResult" class="result"></div>
    </section>

    <section class="panel">
      <h2>[3] View Historical Stock Data (CSV Data)</h2>
      <button id="loadDataBtn">Load Historical Data</button>
      <div id="dataTable" class="table-wrap"></div>
    </section>

    <section class="panel">
      <h2>[4] API Response Display / Logs</h2>
      <pre id="apiLog" class="log-box">No API call yet.</pre>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
